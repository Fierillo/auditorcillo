    <circle cx="62.6" cy="44.6" r="1.2" fill="#f3efe7"/>
    <circle cx="84.6" cy="44.6" r="1.2" fill="#f3efe7"/>
    <path d="M59 33c4-2.4 12-2.6 16 .4" fill="none" stroke="#e8b44c" stroke-width="2" stroke-linecap="round"/>
    <path d="M82 33.2c4-2 11-1.6 15 1.2" fill="none" stroke="#e8b44c" stroke-width="2" stroke-linecap="round"/>
    <path d="M72 58c3.2 5 13 5 16.2 0" fill="none" stroke="#e8b44c" stroke-width="2.3" stroke-linecap="round"/>
