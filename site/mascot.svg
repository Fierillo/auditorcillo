<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 120">
  <!-- Lens sits in the 64×64 'o' cell; handle and nut hang below-right, overflow visible in the wordmark. -->
  <g id="figure">
    <circle cx="32" cy="32" r="28" fill="#1a1714" stroke="#e8b44c" stroke-width="5.5"/>
    <path d="M18 20c6-8 20-9 27-3" fill="none" stroke="#f0d78c" stroke-width="2" stroke-linecap="round" opacity=".4"/>
    <!-- Face looking down-right at the nut. -->
    <ellipse cx="24" cy="28" rx="7" ry="8" fill="#f3efe7"/>
    <ellipse cx="40" cy="28" rx="7" ry="8" fill="#f3efe7"/>
    <circle cx="26.4" cy="30.6" r="3.4" fill="#12100e"/>
    <circle cx="42.4" cy="30.6" r="3.4" fill="#12100e"/>
    <circle cx="25.2" cy="29.2" r="1.1" fill="#f3efe7"/>
    <circle cx="41.2" cy="29.2" r="1.1" fill="#f3efe7"/>
    <path d="M17 19c3.5-2 10-2.2 13.5.6" fill="none" stroke="#e8b44c" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M34 19c3.4-1.8 10-1.4 13.8 1.2" fill="none" stroke="#e8b44c" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M26 41c3 4.2 12 4.2 15 0" fill="none" stroke="#e8b44c" stroke-width="2.1" stroke-linecap="round"/>
    <!-- Handle, then the nut (an object, no face) below it. -->
    <path d="M50 50l16 34" fill="none" stroke="#e8b44c" stroke-width="7" stroke-linecap="round"/>
    <path fill="#c4891c" d="M68 88.2c.6 0 1.1.5 1.1 1.1v2h-2.2v-2c0-.6.5-1.1 1.1-1.1z"/>
    <path fill="#c4891c" d="M59.5 95.5c0-2.5 3.8-4.2 8.5-4.2s8.5 1.7 8.5 4.2z"/>
    <path fill="#e8b44c" d="M59.5 95.5c0 7.6 4 13.2 8.5 14.6 4.5-1.4 8.5-7 8.5-14.6z"/>
  </g>
</svg>
