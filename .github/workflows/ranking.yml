# Probes the mints in mints.json every 3 hours and commits site/ranking.json, plus mints.json when a mint is newly
# flagged as scam or pending; Vercel redeploys the static page.
name: ranking
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ranking
jobs:
  audit:
    runs-on: ubuntu-latest
    # The job clock starts at checkout, so this has to cover a slow install, the whole probe, and the commit.
    # 8 min install + 17 min probe + 3 min commit, with a little slack for step transitions.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        timeout-minutes: 2
        with:
          # The write token stays out of .git/config, so the steps that handle mint data never see it.
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        timeout-minutes: 1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        timeout-minutes: 2
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 3
      # No payment starts unless its whole mint limit fits in the 15 min run budget, so at most 16 min after
      # this step starts no payment can be in flight. This cap only catches a hang. Setup and install have
      # their own caps (8 min together) so a slow or stuck install cannot eat this step's time.
      - name: Probe mints
        timeout-minutes: 17
        run: pnpm rank
        env:
          # Optional: with a Nostr Wallet Connect secret the paid cycle runs on real mints once a day in 12:00-15:00 UTC (09:17 ART slot).
          NWC_URL: ${{ secrets.NWC_URL }}
      # Also after a crashed or timed-out probe: flags saved to mints.json mid-run must not die with the runner.
      - name: Commit ranking
        if: always()
        timeout-minutes: 3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/ranking.json mints.json
          git diff --cached --quiet || {
            git commit -m 'chore: update mint ranking'
            auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
            echo "::add-mask::$auth"
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin "HEAD:$GITHUB_REF_NAME"
          }
